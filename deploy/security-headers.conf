# /etc/nginx/snippets/runratehost-security-headers.conf
# nginx does not inherit add_header into a block that defines its own add_header,
# so this file is included in every location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Add Strict-Transport-Security only after HTTPS works end to end:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
