# /etc/nginx/sites-available/runratehost
# Domain: runrate.host. Certbot adds the 443 server block for you.
#
# The build ships one prerendered HTML file per URL (dist/de/provider/aws/index.html
# for /de/provider/aws), a real 404.html, and .br/.gz copies of every text asset.

server {
    listen 80;
    listen [::]:80;
    server_name runrate.host www.runrate.host;

    # One canonical host: www.runrate.host -> runrate.host (avoids duplicate
    # content). Certbot's ACME challenge path is exempt so certificate issue and
    # renewal for www still work.
    set $to_apex 0;
    if ($host = www.runrate.host) { set $to_apex 1; }
    if ($uri ~ ^/\.well-known/acme-challenge/) { set $to_apex 0; }
    if ($to_apex) { return 301 https://runrate.host$request_uri; }

    root /var/www/runratehost/current;
    index index.html;

    # ---- compression ---------------------------------------------------------
    # Serve the pre-compressed .gz files made at build time (max compression,
    # zero CPU per request); fall back to on-the-fly gzip for anything else.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/ld+json image/svg+xml font/ttf font/otf;

    # Brotli (~20% smaller than gzip). On Ubuntu 24.04:
    #   sudo apt install libnginx-mod-http-brotli-static
    # then uncomment:
    # brotli_static on;

    include snippets/runratehost-security-headers.conf;

    # ---- canonical URLs ------------------------------------------------------
    # Canonical URLs have no trailing slash (/de, /provider/aws). Without these
    # redirects /de/ and /de would be two URLs for the same page.
    rewrite ^/(.+)/$ /$1 permanent;
    location = /index.html { return 301 /; }
    location ~ ^/(.+)/index\.html$ { return 301 /$1; }

    # ---- hashed build output: cache for a year -------------------------------
    # Vite fingerprints everything in /assets, so it can never go stale.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/runratehost-security-headers.conf;
    }

    # ---- other static files --------------------------------------------------
    location ~* \.(?:ico|png|jpg|jpeg|webp|avif|svg|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/runratehost-security-headers.conf;
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; include snippets/runratehost-security-headers.conf; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; include snippets/runratehost-security-headers.conf; }

    # ---- prerendered pages ---------------------------------------------------
    # /de/provider/aws -> /de/provider/aws/index.html, served directly (no
    # redirect). Anything that wasn't prerendered is a genuine 404, not the app
    # shell with a 200 (a "soft 404" that search engines penalise).
    # "no-cache" = revalidate every time (ETag), so a deploy is picked up at once.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include snippets/runratehost-security-headers.conf;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        include snippets/runratehost-security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include snippets/runratehost-security-headers.conf;
    }
}
