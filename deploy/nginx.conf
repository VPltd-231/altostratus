# /etc/nginx/sites-available/runratehost
# Replace example.com with your domain. Certbot adds the 443 server block for you.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/runratehost/current;
    index index.html;

    # ---- compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    include snippets/runratehost-security-headers.conf;

    # ---- hashed build output: cache for a year -------------------------------
    # Vite fingerprints everything in /assets, so it can never go stale.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/runratehost-security-headers.conf;
    }

    # ---- other static files --------------------------------------------------
    location ~* \.(?:ico|png|jpg|jpeg|webp|avif|svg|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/runratehost-security-headers.conf;
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; include snippets/runratehost-security-headers.conf; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; include snippets/runratehost-security-headers.conf; }

    # ---- app shell: always revalidate so a deploy is picked up immediately ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include snippets/runratehost-security-headers.conf;
    }
}
